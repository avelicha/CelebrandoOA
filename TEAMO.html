<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Tavo ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle, #1a0010 0%, #050005 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* Fondo animado de partículas */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    /* Corazón animado con CSS */
    .heart {
      position: relative;
      width: 100px;
      height: 90px;
      margin-bottom: 50px;
      animation: beat 1.2s infinite ease-in-out;
      filter: drop-shadow(0 0 25px #ff2a6d);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      left: 50px;
      top: 0;
      width: 50px;
      height: 80px;
      background: #ff2a6d;
      border-radius: 50px 50px 0 0;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }

    .heart::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }

    /* Latido continuo */
    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }
      15% {
        transform: scale(1.25);
      }
      30% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.15);
      }
    }

    /* Estilo del mensaje */
    .message {
      font-size: 1.8rem;
      font-weight: 500;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 42, 109, 0.7);
      max-width: 600px;
      min-height: 80px;
      line-height: 1.5;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      background-color: #ff2a6d;
      margin-left: 5px;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Fondo interactivo -->
  <canvas id="particles"></canvas>

  <div class="container">
    <!-- Corazón latiendo -->
    <div class="heart"></div>
    
    <!-- Mensaje animado -->
    <div class="message">
      <span id="text"></span><span class="cursor">&nbsp;</span>
    </div>
  </div>

  <script>
    // Texto a escribir
    const texto = "Para mi Tavo:      ¡Eres una persona increíble y muy especial!   ¡ Felices 2 meses mi amor, vamos por muchos muchos más, han pasado súper rapidisimo. Te AMOOOOOOOOO ! ❤️";
    const speed = 70; // Velocidad de escritura en ms
    let index = 0;

    function typeWriter() {
      if (index < texto.length) {
        document.getElementById("text").textContent += texto.charAt(index);
        index++;
        setTimeout(typeWriter, speed);
      }
    }

    // Iniciar efecto mecanografía
    window.onload = () => {
      setTimeout(typeWriter, 500);
      initParticles();
    };

    // Fondo de destellos flotantes
    function initParticles() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particlesArray = [];
      const numberOfParticles = 60;

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 3 + 1;
          this.speedX = (Math.random() - 0.5) * 0.5;
          this.speedY = (Math.random() - 0.5) * 0.5;
          this.opacity = Math.random() * 0.8 + 0.2;
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;

          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }

        draw() {
          ctx.fillStyle = `rgba(255, 182, 193, ${this.opacity})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (let i = 0; i < numberOfParticles; i++) {
        particlesArray.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
        }
        requestAnimationFrame(animate);
      }

      animate();

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    }
  </script>
</body>
</html>
